<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" fill="#ffffff"/>
  <!-- Bande supérieure bleu RDC -->
  <rect x="0" y="0" width="200" height="6" fill="#003DA5"/>
  <!-- Bande inférieure verte RDC -->
  <rect x="0" y="194" width="200" height="6" fill="#009A44"/>

  <!-- Sigle "CAA" en grand -->
  <text x="100" y="108" font-family="Arial Black,Arial,Helvetica,sans-serif"
        font-size="58" font-weight="900" fill="#003DA5"
        text-anchor="middle" letter-spacing="-1">CAA</text>

  <!-- Sous-titre -->
  <text x="100" y="148" font-family="Arial,Helvetica,sans-serif"
        font-size="11" font-weight="400" fill="#555555"
        text-anchor="middle" letter-spacing="3">AVIATION</text>

  <!-- Ligne décorative -->
  <rect x="45" y="156" width="110" height="2" fill="#003DA5" rx="1"/>
</svg>
